[package]
name = "appendfs"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive", "rc"] }
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
blake3 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rpassword = "7.3"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.8"
zstd = "0.13"

[build-dependencies]
cc = "1.0"
pkg-config = "0.3"

[dev-dependencies]
tempfile = "3.8"
